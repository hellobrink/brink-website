# Sveltia CMS configuration for the Brink website.
#
# This describes the same content collections defined in
# src/content.config.ts as editable forms. Editors work at /admin, save,
# and their change is committed to the branch named below, which rebuilds
# the site.
#
# IMPORTANT: Sveltia commits a save DIRECTLY to `branch` — there is no
# per-save pull-request review step. The review buffer comes from *which
# branch* the CMS writes to: point it at a `staging` branch and promote to
# the live branch with a merge when you're happy. See CMS_SETUP.md.
#
# The auth `base_url` must point at your deployed sveltia-cms-auth Cloudflare
# Worker — see CMS_SETUP.md. Until that value is set, GitHub login will fail.

backend:
  name: github
  repo: hellobrink/brink-website
  # The branch the CMS reads and writes. Pre-cutover this is `main` (which
  # deploys to the github.io preview). At cutover, switch to `staging` so
  # edits land on staging and are promoted to live by merging.
  branch: main
  base_url: https://brink-cms-auth.brink-global.workers.dev

# Uploaded images land in public/images; the path written into content omits
# the /brink-website base prefix, which the site adds at render time.
media_folder: public/images
public_folder: /images

site_url: https://hellobrink.github.io/brink-website
display_url: https://hellobrink.github.io/brink-website

collections:
  # --- Blog --------------------------------------------------------------
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subheading, label: Subheading (standfirst), widget: string, required: false }
      - { name: summary, label: Summary (search/meta), widget: text, required: false }
      - name: date
        label: Publish date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD MMMM YYYY'
        time_format: false
        picker_utc: true
        required: false
      - { name: authorName, label: Author name, widget: string, required: false }
      - name: authorSlug
        label: Author — link to team bio (optional)
        widget: relation
        collection: team
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
        required: false
      - { name: authorName2, label: Second author name (optional), widget: string, required: false }
      - name: authorSlug2
        label: Second author — link to team bio (optional)
        widget: relation
        collection: team
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
        required: false
      - { name: heroImage, label: Thumbnail (square), widget: image, required: false }
      - { name: heroAlt, label: Thumbnail alt text, widget: string, required: false }
      - { name: bannerImage, label: Banner (landscape, top of post), widget: image, required: false }
      - { name: bannerAlt, label: Banner alt text, widget: string, required: false }
      - { name: longform, label: "Long-form magazine layout (sticky images)", widget: boolean, default: false, required: false }
      - { name: sortOrder, label: "Manual order (tiebreaker for same-date posts; lower = first)", widget: number, default: 0, value_type: int }
      - { name: body, label: Body, widget: markdown }

  # --- Team --------------------------------------------------------------
  - name: team
    label: Team members
    label_singular: Team member
    folder: src/content/team
    create: true
    slug: '{{slug}}'
    identifier_field: name
    extension: md
    format: frontmatter
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - { name: photo, label: Portrait, widget: image, required: false }
      - { name: photoAlt, label: Portrait alt text, widget: string, required: false }
      - { name: photoHover, label: Hover portrait (swaps in on hover), widget: image, required: false }
      - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
      - name: regions
        label: Regions (filters on the team page)
        widget: list
        required: false
        field: { name: region, label: Region, widget: string }
      - name: teams
        label: Teams (filters on the team page)
        widget: list
        required: false
        field: { name: team, label: Team, widget: string }
      - name: questions
        label: Questions they're exploring
        widget: list
        required: false
        field: { name: question, label: Question, widget: string }
      - { name: sortOrder, label: Sort order, widget: number, default: 0, value_type: int }
      - { name: body, label: Bio, widget: markdown, required: false }

  # --- Work / case studies ----------------------------------------------
  - name: work
    label: Work & case studies
    label_singular: Work item
    folder: src/content/work
    create: true
    slug: '{{slug}}'
    identifier_field: title
    extension: md
    format: frontmatter
    summary: '{{title}} · {{status}}'
    description: >-
      Every project Brink has run. An item can be a simple listing (a card on
      Our Work) or a full case study with its own page. Fill the BASICS for
      every item. Only fill the CASE STUDY section if you turn on "Has a full
      case study?". Minimum for a case study: a hero image, a standfirst, one
      challenge paragraph, at least one result, the "How we did it" points, and
      a timeline and location. A fuller one adds the "story in more detail"
      narrative, quotes, funders and partners, and a gallery.
    fields:
      # --- Basics: fill these for every item ---
      - name: title
        label: Title
        widget: string
        hint: "Shown as the page heading and the card title. For a case study, write it as what was achieved (e.g. 'Piloting a radical new platform for locust control in Kenya'), not just the programme name."
      - name: programmeName
        label: Programme name (if different to title)
        widget: string
        required: false
        hint: "Short recognisable name (e.g. 'EdTech Hub', 'ASToN'), shown as the small kicker above the title. Leave blank if the title already is the name."
      - name: summary
        label: Summary
        widget: text
        hint: "One or two sentences. Shown on the Our Work card and used for search and social previews. Fill this for every item."
      - name: status
        label: Status
        widget: select
        options: [current, past]
        default: past
        hint: "'current' shows as a large band at the top of Our Work; 'past' shows as a card in the grid below."
      - name: sector
        label: Sector(s)
        widget: select
        multiple: true
        required: false
        options: [climate, health, education]
        hint: "Drives the sector filters and sector pages. Pick any that apply, or leave blank."
      - name: offer
        label: Offer(s)
        widget: select
        multiple: true
        required: false
        options: [open-innovation, carve-outs, missions]
        hint: "Which Brink offer this is an example of. Drives the offer filters. Optional."
      - name: sortOrder
        label: Sort order
        widget: number
        default: 0
        value_type: int
        hint: "Lower numbers appear first within the current or past group. Optional."

      # --- Images ---
      - name: heroImage
        label: Hero image
        widget: image
        required: false
        hint: "Landscape image used as the card thumbnail and the banner at the top of the case study (roughly 3:2, e.g. 1080x720). Optional but strongly recommended; cards without one look bare."
      - name: heroAlt
        label: Hero alt text
        widget: string
        required: false
        hint: "Describe the image for screen readers and for when it fails to load."
      - name: heroPosition
        label: Hero crop position
        widget: string
        required: false
        hint: "Only needed if the default centre crop clips faces, e.g. 'center 25%'. Optional."
      - name: logo
        label: Programme logo
        widget: image
        required: false
        hint: "Logomark, only used on the bands for current programmes. Most past items do not need one."
      - name: logoAlt
        label: Logo alt text
        widget: string
        required: false

      # --- Credits & links: shown on the card; no full write-up needed ---
      - name: funders
        label: Funders
        widget: list
        required: false
        hint: "Who funded the work. Shown on the card and case study. Add a URL to turn the name into a link."
        fields:
          - { name: name, label: Name, widget: string }
          - { name: url, label: URL (optional), widget: string, required: false }
      - name: partners
        label: Partners
        widget: list
        required: false
        hint: "Delivery partners, shown alongside funders."
        fields:
          - { name: name, label: Name, widget: string }
          - { name: url, label: URL (optional), widget: string, required: false }
      - name: externalLink
        label: External link
        widget: string
        required: false
        hint: "If the write-up lives on another site, put the URL here and the card links out ('Visit the programme'). Use this instead of a full case study, not as well."
      - name: caseStudyRef
        label: Case study lives on another work item (optional)
        widget: relation
        collection: work
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "If this item's story is told on a different work item, pick it here and the card links to that one."

      # --- CASE STUDY: everything below is ignored unless the toggle is on ---
      - name: hasCaseStudy
        label: Has a full case study?
        widget: boolean
        default: false
        hint: >-
          Turn on to give this item its own case-study page. MINIMUM: a hero
          image, a standfirst, one challenge paragraph, at least one result, the
          "How we did it" points, and a timeline and location. A FULLER case
          study also adds the "story in more detail" narrative below.
      - name: standfirst
        label: Standfirst
        widget: text
        required: false
        hint: "The opening line under the title on the case-study page (one or two sentences). Needed for a case study."
      - name: challenge
        label: The challenge
        widget: list
        required: false
        hint: "The problem, in one to three short paragraphs (add one item per paragraph). Needed for a case study."
        field: { name: para, label: Paragraph, widget: text }
      - name: results
        label: What was achieved
        widget: list
        required: false
        hint: "The outcomes, one bullet each. Shown as the 'What was achieved' list. Add at least one for a case study."
        field: { name: para, label: Point, widget: text }
      - name: approachIntro
        label: How we did it (intro)
        widget: list
        required: false
        hint: "Optional intro paragraph(s) above the 'How we did it' points."
        field: { name: para, label: Paragraph, widget: text }
      - name: approach
        label: How we did it (points)
        widget: list
        required: false
        hint: "The method, as points. Part of the minimum for a case study. Start each with a bold lead-in then the detail, e.g. '**Enabling crucial conversations:** ...'."
        field: { name: para, label: Point, widget: text }
      - name: body
        label: Case study narrative (the story in more detail)
        widget: markdown
        required: false
        hint: "The long read, written as normal prose with ## subheadings and bullet lists. Leave blank for a short case study; fill it for a full one. This is where most of the depth goes."
      - name: storyQuotes
        label: Story pull-quotes
        widget: list
        required: false
        hint: "Quotes lifted from the narrative, shown as highlighted pull-quotes. Attribution optional. Optional."
        fields:
          - { name: text, label: Quote, widget: text }
          - { name: attribution, label: Attribution (optional, may contain a link), widget: string, required: false }
      - name: quote
        label: Featured quote (with photo)
        widget: object
        required: false
        collapsed: true
        hint: "A single named quote shown as a portrait pull-quote. Use for an attributable quote with a person's name and role. Optional."
        fields:
          - { name: text, label: Quote, widget: text }
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string, required: false }
          - { name: photo, label: Photo, widget: image, required: false }
          - { name: photoAlt, label: Photo alt text, widget: string, required: false }
      - name: gallery
        label: Gallery
        widget: list
        required: false
        hint: "Extra images with captions, shown within the case study. Optional."
        fields:
          - { name: image, label: Image, widget: image }
          - { name: alt, label: Alt text, widget: string }
          - { name: caption, label: Caption (optional), widget: string, required: false }
      - name: headlineResult
        label: Headline result (on case-study cards)
        widget: string
        required: false
        hint: "A single standout stat shown on case-study cards, e.g. 'GBP 2.4m unlocked for 12 teams'. Optional."
      - name: timeline
        label: Timeline
        widget: string
        required: false
        hint: "e.g. '2021 – 2022' or '2019 – Ongoing'. Shown in the case-study details. Part of the minimum for a case study."
      - name: location
        label: Location
        widget: string
        required: false
        hint: "Country, city or region. Shown in the case-study details. Part of the minimum for a case study."
      - name: year
        label: Year
        widget: string
        required: false
        hint: "A single year, if you are not using Timeline. Optional."
      - name: fullStoryUrl
        label: Full story URL
        widget: string
        required: false
        hint: "Optional 'read the full story' link at the end of the case study."
      - name: conclusion
        label: Conclusion
        widget: text
        required: false
        hint: "Optional closing paragraph."

  # --- Sectors -----------------------------------------------------------
  - name: sectors
    label: Sector pages
    label_singular: Sector
    folder: src/content/sectors
    create: true
    slug: '{{slug}}'
    identifier_field: name
    extension: md
    format: frontmatter
    fields:
      - { name: name, label: Name, widget: string }
      - name: accent
        label: Accent colour
        widget: select
        options: [teal, coral, blue]
        default: teal
      - { name: headline, label: Hero headline, widget: text }
      - { name: positioningLine, label: Positioning line (search / About carousel), widget: text, required: false }
      - name: stats
        label: Impact stats
        widget: list
        required: false
        fields:
          - { name: pre, label: Caption before number, widget: string, required: false }
          - { name: value, label: Number, widget: string }
          - { name: post, label: Caption after number, widget: string, required: false }
      - name: challenge
        label: The challenge
        widget: list
        required: false
        field: { name: para, label: Paragraph, widget: text }
      - name: approach
        label: Our approach
        widget: list
        required: false
        field: { name: para, label: Paragraph, widget: text }
      - { name: challengeImage, label: Challenge image, widget: image, required: false }
      - { name: challengeImageAlt, label: Challenge image alt text, widget: string, required: false }
      - name: principles
        label: Principles
        widget: list
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - name: body
            label: Body
            widget: list
            field: { name: para, label: Paragraph, widget: text }
      - name: caseStudies
        label: Case study cards
        widget: list
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: quote, label: Quote, widget: text, required: false }
          - name: slug
            label: Internal work item (optional)
            widget: relation
            collection: work
            value_field: '{{slug}}'
            search_fields: [title]
            display_fields: [title]
            required: false
          - { name: url, label: External URL (optional), widget: string, required: false }
          - { name: image, label: Card image, widget: image, required: false }
      - name: contact
        label: Named contact
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: photo, label: Photo, widget: image, required: false }
      - { name: body, label: Body (optional), widget: markdown, required: false }

  # --- Offers ------------------------------------------------------------
  - name: offers
    label: Offers
    label_singular: Offer
    folder: src/content/offers
    create: true
    slug: '{{slug}}'
    identifier_field: name
    extension: md
    format: frontmatter
    fields:
      - { name: name, label: Name, widget: string }
      - { name: summary, label: Summary (subheading), widget: string }
      - name: ground
        label: Banner colour
        widget: select
        options: [teal, coral, blue, pink]
        default: teal
      - { name: heroImage, label: Header image, widget: image, required: false }
      - { name: heroAlt, label: Header image alt text, widget: string, required: false }
      - { name: lead, label: Lead statement, widget: text, required: false }
      - name: intro
        label: Intro paragraphs
        widget: list
        required: false
        field: { name: para, label: Paragraph, widget: text }
      - name: groups
        label: Content groups
        widget: list
        required: false
        fields:
          - { name: lead, label: Group heading, widget: text }
          - name: items
            label: Points
            widget: list
            field: { name: item, label: Point, widget: text }
      - { name: note, label: Closing note (optional), widget: text, required: false }
      - { name: body, label: Body (optional), widget: markdown, required: false }

  # --- Shared behavioural panel -----------------------------------------
  - name: shared
    label: Shared blocks
    label_singular: Shared block
    folder: src/content/shared
    create: true
    slug: '{{slug}}'
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: image, label: Image, widget: image, required: false }
      - { name: imageAlt, label: Image alt text, widget: string, required: false }
      - { name: body, label: Body, widget: markdown, required: false }

  # --- One-off pages -----------------------------------------------------
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: true
    slug: '{{slug}}'
    identifier_field: title
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: body, label: Body, widget: markdown }
